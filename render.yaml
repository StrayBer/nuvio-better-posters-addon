services:
  - type: web
    name: nuvio-better-posters
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ALLOW_PRIVATE_UPSTREAMS
        value: "0"
      - key: MIGRATION_TARGET_BASE_URL
        value: "https://nuvio-better-posters.nuvio-better-posters-addon.workers.dev"
